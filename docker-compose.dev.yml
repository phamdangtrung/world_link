version: '3'

# Containers we're going to run.
services:
  # Our Phoenix container.
  app:
    # The build parameters for this container.
    build:
      # Here we define that it should build from the current directory.
      context: .
      dockerfile: Dockerfile.dev
    networks:
        - frontend
        - backend
    environment:
      # Variables to connect to our Postgres server.
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: wl_development
      PGPORT: 5432
      PGHOST: db
      MIX_ENV: dev
      SECRET_KEY_BASE: 1pgOXG0OBIck/SEygTHsOBmHX3Nc0s/EtHk/653kcanwdj/AMX1GiqiVlcgXIyp3
    volumes:
      - /app/assets/node_modules
      - ./assets:/app/assets
      - ./config:/app/config:ro
      - ./lib:/app/lib:ro
      - ./priv:/app/priv
      - ./test:/app/test:ro
      - ./mix.exs:/app/mix.exs:ro
    ports:
      # Mapping the port to make the Phoenix app accessible outside of the container.
      - 4000:4000
    # depends_on:
      # The DB container needs to be started before we start this container.
      # - db
    links:
      - db
    stdin_open: true
    tty: true

  db:
    # We use the predefined Postgres image.
    image: postgres:16.4-alpine3.19
    networks:
        - backend
    environment:
      # Set user/password for Postgres.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # Set a path where Postgres should store the data.
      PGDATA: /var/lib/postgresql/data/pgdata
    restart: unless-stopped
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data/dev

# Specify networks
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

# Define the volumes.
volumes:
  pgdata:
    driver: local
